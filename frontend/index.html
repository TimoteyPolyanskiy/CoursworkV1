<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг доставки — Головна</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
        background: #121212; 
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .app-header {
        background: #1E1E2E;
        height: 64px;
        padding: 0 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1001;
        flex-shrink: 0;
      }
      
      .app-title { 
        color: #E2E8F0; 
        font-size: 20px; 
        font-weight: 600; 
        margin: 0; 
      }

      .header-controls {
        display: flex;
        gap: 15px;
      }

      #mapWrapper {
        position: relative;
        flex-grow: 1;
        width: 100%;
      }
      
      #map { 
        height: 100%;
        width: 100%;
        z-index: 1; 
      }

      .legend {
        position: absolute;
        top: 20px; 
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 12px 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        z-index: 1000;
        font-size: 14px;
        line-height: 1.5;
        border: 1px solid #ccc;
        color: #333;
        min-width: 180px;
      }

      .btn-custom {
        font-weight: 600;
        min-width: 160px;
      }
    </style>
  </head>
  <body>
    
    <header class="app-header">
      <h1 class="app-title">📍 Система моніторингу</h1>
      
      <div class="header-controls">
        <button id="btnSimToggle" class="btn btn-success btn-sm btn-custom" onclick="toggleSimulation()">
          ▶ Запуск симуляції
        </button>
        
        <a href="/monitor" target="_blank" class="btn btn-outline-info btn-sm btn-custom d-flex align-items-center justify-content-center">
          📊 Моніторинг
        </a>
      </div>
    </header>

    <div id="mapWrapper">
      <div class="legend">
        <strong>Статус системи</strong><br />
        <span id="updateStatus" style="color: #666;">Очікування даних...</span>
      </div>
      
      <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>

      const map = L.map('map', { zoomControl: false }).setView([49.8397, 24.0297], 13);

      L.control.zoom({
        position: 'bottomright'
      }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const markers = new Map();

      const btnSimToggle = document.getElementById('btnSimToggle');
      let isSimRunning = false;

      async function checkSimStatus() {
        try {
          const res = await fetch('/simulation/status');
          const data = await res.json();
          updateSimButton(data.running);
        } catch (e) {
          console.error("Не вдалося отримати статус симуляції. Чи запущено main.py?");
        }
      }

      function updateSimButton(running) {
        isSimRunning = running;
        if (running) {
          btnSimToggle.textContent = "⏹ Зупинка симуляції";
          btnSimToggle.classList.remove('btn-success');
          btnSimToggle.classList.add('btn-danger');
        } else {
          btnSimToggle.textContent = "▶ Запуск симуляції";
          btnSimToggle.classList.remove('btn-danger');
          btnSimToggle.classList.add('btn-success');
        }
      }

      async function toggleSimulation() {
        const endpoint = isSimRunning ? '/simulation/stop' : '/simulation/start';
        btnSimToggle.disabled = true; 
        
        try {
          const res = await fetch(endpoint, { method: 'POST' });
          const data = await res.json();
          
          if (data.status === 'started' || data.status === 'already_running') {
            updateSimButton(true);
          } else if (data.status === 'stopped' || data.status === 'not_running') {
            updateSimButton(false);
          }
        } catch (err) {
          alert("Помилка з'єднання з сервером. Перевірте, чи запущено main.py");
        } finally {
          btnSimToggle.disabled = false;
        }
      }

      checkSimStatus();

      function upsertMarker(pos) {
        const { object_id, lat, lon, speed, ts } = pos;
        
        const popupContent = `
          <div style="font-size:14px; color: #333;">
            <b>${object_id}</b><br/>
            Швидкість: ${Math.round(speed)} км/год<br/>
            Час: ${new Date(ts).toLocaleTimeString()}
          </div>
        `;

        if (markers.has(object_id)) {
          const m = markers.get(object_id);
          m.setLatLng([lat, lon]);
          
          if (m.getPopup()) {
             m.getPopup().setContent(popupContent);
          } else {
             m.bindPopup(popupContent);
          }
        } else {
          const m = L.marker([lat, lon]).addTo(map).bindPopup(popupContent);
          markers.set(object_id, m);
        }
      }

      async function fetchPositions() {
        try {
          const res = await fetch('/last_positions');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          
          const ids = new Set();
          data.forEach((pos) => {
            ids.add(pos.object_id);
            upsertMarker(pos);
          });

          const statusEl = document.getElementById('updateStatus');
          if (data.length > 0) {
            statusEl.innerHTML = `Активні об'єкти: <b>${data.length}</b><br/>Останнє оновлення: ${new Date().toLocaleTimeString()}`;
            statusEl.style.color = '#28a745';
          } else {
            statusEl.innerHTML = `Немає даних<br/>(Симуляцію зупинено?)`;
            statusEl.style.color = '#dc3545';
          }

          Array.from(markers.keys()).forEach((id) => {
            if (!ids.has(id)) {
              map.removeLayer(markers.get(id));
              markers.delete(id);
            }
          });
        } catch (err) {
          console.error('Fetch error', err);
        }
      }

      fetchPositions();
      setInterval(fetchPositions, 1000);
    </script>
  </body>
</html>
