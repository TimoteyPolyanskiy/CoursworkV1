# Orchestrates the database (TimescaleDB + PostGIS), FastAPI app, and pgAdmin.

version: "3.9"

services:
  db:
    image: timescale/timescaledb-postgis:latest-pg14
    container_name: delivery_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: delivery_app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: delivery
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_BASE_DIR: /code
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      # Mount frontend so /map can serve index.html
      - ./frontend:/code/frontend:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: delivery_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db_data:

